    // CSV 解析器
    const parseCSV = (str) => {
      const arr = [];
      let quote = false;
      let row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { ++col; continue; }
        if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc === '\n' && !quote) { ++row; col = 0; continue; }
        if (cc === '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] = (arr[row][col] || '') + cc;
      }
      if (arr.length === 0) return [];
      const headers = arr[0];
      const data = [];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i].length <= 1 && !arr[i][0]) continue;
        const obj = {};
        headers.forEach((h, j) => {
          obj[h ? h.trim() : `Column_${j}`] = arr[i][j] ? arr[i][j].trim() : '';
        });
        data.push(obj);
      }
      return data;
    };

    // Base64 UTF-8 編解碼（供整頁交接網址分享使用）
    const encodeShareState = (obj) => {
      try {
        const json = JSON.stringify(obj);
        const bytes = new TextEncoder().encode(json);
        let bin = '';
        bytes.forEach((b) => { bin += String.fromCharCode(b); });
        return btoa(bin);
      } catch (e) {
        return '';
      }
    };

    const decodeShareState = (str) => {
      try {
        const bin = atob(str);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    function DesignIntakeSystem() {
      const [csvUrl, setCsvUrl] = useState(() => localStorage.getItem('lp_custom_csv_url') || DEFAULT_CSV_URL);

      const [showAllModal, setShowAllModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [isSharedView, setIsSharedView] = useState(false);
      const [isExportingPng, setIsExportingPng] = useState(false);

      const handoverCardRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      // 同步 Google 試算表 CSV 資料
      const fetchSheetData = async (targetUrl) => {
        setIsLoadingDB(true);
        const cacheBuster = `${targetUrl}${targetUrl.includes('?') ? '&' : '?'}t=${Date.now()}`;
        const urlsToTry = [
          cacheBuster,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(cacheBuster)}`
        ];

        for (const u of urlsToTry) {
          try {
            const res = await fetch(u);
            if (!res.ok) continue;
            const text = await res.text();
            if (text.includes('<html') || text.includes('<!DOCTYPE')) continue;

            const parsed = parseCSV(text);
            const formatted = parsed.map((item, idx) => {
              const getVal = (keys) => {
                const found = Object.keys(item).find(k => keys.includes(k.trim().toLowerCase()));
                return found ? item[found] : '';
              };
              const id = getVal(['id', '編號', '序號']) || String(idx + 1);
              const platform = getVal(['platform', '平台', '平台名稱']) || '其他';
              const title = getVal(['title', '課程名稱', '名稱', '課名', '專案名稱']);
              const t1 = normalizeTag(getVal(['tag1', 'tag 1', 'tag_1', '賣點', '主要吸引力', '課程賣點']));
              const t2 = normalizeTag(getVal(['tag2', 'tag 2', 'tag_2', '風格', '視覺氛圍', '視覺風格']));
              const image = getVal(['image_url', 'image', '圖片網址', '圖片連結', '封面圖', '圖片']);
              const url = getVal(['url', '課程網址', '課程連結', '連結']);

              return {
                id,
                platform,
                title,
                tags: [t1, t2].filter(Boolean),
                image,
                url
              };
            }).filter(c => c.title);

            if (formatted.length > 0) {
              setCoursesDatabase(formatted);
              setIsLoadingDB(false);
              return;
            }
          } catch (e) {
            // 繼續嘗試備援通道
          }
        }
        // 若網路受限或尚未發布，保留內建 24 筆 V4 資料
        setIsLoadingDB(false);
      };

      useEffect(() => {
        fetchSheetData(csvUrl);
      }, [csvUrl]);

      // Step 1: 專案基本資料
      const [formData, setFormData] = useState({
        teacherName: '',
        courseItem: '',
        courseFeatures: '',
        competitors: [{ url: '', note: '' }]
      });

      // Step 2: 視覺大方向收斂
      const [visionData, setVisionData] = useState({ tag1: '', tag2: '' });

      // Step 3: 拍課包裝企劃
      const [packData, setPackData] = useState({
        spaces: [{ image: '', desc: '' }],
        teachers: [{ image: '', desc: '' }],
        props: [{ image: '', desc: '' }]
      });

      // 檢查網址是否帶有 #share= 交接單參數
      useEffect(() => {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#share=')) {
          const encoded = hash.replace('#share=', '');
          const decoded = decodeShareState(encoded);
          if (decoded) {
            if (decoded.formData) setFormData(prev => ({ ...prev, ...decoded.formData }));
            if (decoded.visionData) setVisionData(decoded.visionData);
            if (decoded.packData) setPackData(decoded.packData);
            setIsSharedView(true);
          }
        }
      }, []);

      // Step 1 操作
      const addCompetitor = () => setFormData({ ...formData, competitors: [...formData.competitors, { url: '', note: '' }] });
      const updateCompetitor = (index, field, value) => {
        const newComp = [...formData.competitors];
        newComp[index][field] = value;
        setFormData({ ...formData, competitors: newComp });
      };
      const removeCompetitor = (index) => {
        const newComp = [...formData.competitors];
        newComp.splice(index, 1);
        setFormData({ ...formData, competitors: newComp });
      };

      // Step 2 嚴格雙重條件比對（必須同時選定且兩個標籤皆相符）
      const matchedCourses = useMemo(() => {
        if (!visionData.tag1 || !visionData.tag2) return [];
        return coursesDatabase.filter(c =>
          c.tags.includes(visionData.tag1) && c.tags.includes(visionData.tag2)
        );
      }, [visionData.tag1, visionData.tag2, coursesDatabase]);

      const selectedStyleName = useMemo(() => {
        if (!visionData.tag1 || !visionData.tag2) return '';
        return `${visionData.tag1} × ${visionData.tag2}`;
      }, [visionData.tag1, visionData.tag2]);

      // Step 3 圖文操作
      const handlePackChange = (category, index, field, value) => {
        const newData = { ...packData };
        newData[category][index][field] = value;
        setPackData(newData);
      };
      const addPackItem = (category) => {
        setPackData({ ...packData, [category]: [...packData[category], { image: '', desc: '' }] });
      };
      const removePackItem = (category, index) => {
        const newData = { ...packData };
        newData[category].splice(index, 1);
        setPackData(newData);
      };

      const handleFileUpload = (category, index, file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          handlePackChange(category, index, 'image', e.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handlePasteImage = (e, category, index) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            e.preventDefault();
            const file = items[i].getAsFile();
            handleFileUpload(category, index, file);
            showToast('📸 已從剪貼簿貼上截圖！');
            break;
          }
        }
      };

      // 渲染 Step 3 一列三張卡片（1:1 方形上圖 ＋ 下文）
      const renderDynamicGrid = (title, category, placeholderDesc) => (
        <div className="mb-8 bg-[#FAF7F2]/60 p-5 rounded-2xl border border-[#EBE4D8]">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold text-[#382D25] text-base">{title}</h3>
            <button
              type="button"
              onClick={() => addPackItem(category)}
              className="text-xs font-bold text-[#7a5e48] hover:text-[#382D25] bg-white border border-[#EBE4D8] px-3 py-1.5 rounded-lg shadow-xs transition-colors"
            >
              + 新增項目
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            {packData[category].map((item, i) => (
              <div
                key={i}
                onPaste={(e) => handlePasteImage(e, category, i)}
                className="bg-white p-3.5 rounded-xl border border-stone-200 shadow-xs flex flex-col justify-between relative group"
              >
                {packData[category].length > 1 && (
                  <button
                    type="button"
                    onClick={() => removePackItem(category, i)}
                    title="刪除此卡片"
                    className="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-stone-100 hover:bg-red-50 text-stone-400 hover:text-red-500 flex items-center justify-center text-sm font-bold transition-colors z-10"
                  >
                    ×
                  </button>
                )}

                {/* 上半部：1:1 方形圖片預覽與網址/上傳操作 */}
                <div>
                  <div className="text-[11px] font-bold text-stone-400 mb-2">項目 #{i + 1}</div>
                  <div className="relative w-full pb-[100%] bg-stone-100 rounded-lg overflow-hidden border border-stone-200 mb-2.5">
                    <div className="absolute inset-0 flex items-center justify-center">
                      {item.image ? (
                        <img
                          src={item.image}
                          alt={`參考圖 ${i + 1}`}
                          className="w-full h-full object-cover"
                          onError={(e) => {
                            e.target.style.display = 'none';
                            if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                          }}
                        />
                      ) : null}
                      <div
                        style={{ display: item.image ? 'none' : 'flex' }}
                        className="flex-col items-center justify-center text-center p-3 text-stone-400"
                      >
                        <span className="text-2xl mb-1.5">🖼️</span>
                        <span className="text-[11px] leading-relaxed">貼上圖片網址、上傳圖檔<br/>或點此按 Ctrl+V 貼上截圖</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex gap-1.5 mb-2.5">
                    <input
                      type="text"
                      placeholder="貼上參考圖片網址..."
                      className="min-w-0 flex-1 p-2 text-xs border border-stone-200 rounded-lg outline-none focus:border-[#9C795E] bg-stone-50 focus:bg-white"
                      value={item.image.startsWith('data:image') ? '（已上傳本機圖片）' : item.image}
                      onChange={(e) => handlePackChange(category, i, 'image', e.target.value)}
                    />
                    <label className="cursor-pointer shrink-0 whitespace-nowrap bg-[#FAF7F2] hover:bg-[#f0e9df] text-[#7a5e48] border border-[#EBE4D8] px-2.5 py-2 rounded-lg text-xs font-bold flex items-center transition-colors">
                      上傳圖片
                      <input
                        type="file"
                        accept="image/*"
                        className="hidden"
                        onChange={(e) => handleFileUpload(category, i, e.target.files[0])}
                      />
                    </label>
                    {item.image && (
                      <button
                        type="button"
                        onClick={() => handlePackChange(category, i, 'image', '')}
                        className="shrink-0 whitespace-nowrap text-xs text-stone-400 hover:text-red-500 px-1"
                        title="清除圖片"
                      >
                        清除
                      </button>
                    )}
                  </div>
                </div>

                {/* 下半部：圖片正下方說明欄位 */}
                <div>
                  <label className="block text-[11px] font-bold text-stone-500 mb-1">畫面與需求說明</label>
                  <textarea
                    rows="2"
                    placeholder={placeholderDesc}
                    className="w-full p-2 text-xs border border-stone-200 rounded-lg outline-none focus:ring-1 focus:ring-[#9C795E] resize-none"
                    value={item.desc}
                    onChange={(e) => handlePackChange(category, i, 'desc', e.target.value)}
                  ></textarea>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      // 組裝純文字交接單
      const buildPlainText = () => {
        let md = `📋 【Landing Page 設計與拍課交接單】\n\n`;
        md += `### 📝 基本資料\n`;
        md += `- 老師 / 品牌：${formData.teacherName || '未填'}\n`;
        md += `- 課程品項：${formData.courseItem || '未填'}\n`;
        md += `- 課程特色：${formData.courseFeatures || '未填'}\n\n`;

        const validComps = formData.competitors.filter(c => c.url || c.note);
        if (validComps.length > 0) {
          md += `🔍 競品對標參考：\n`;
          validComps.forEach((c, i) => {
            md += `  ${i + 1}. ${c.url || '未附連結'} ｜ 參考重點：${c.note || '無'}\n`;
          });
          md += `\n`;
        }

        md += `### 🎨 視覺大方向\n`;
        md += `- 主要吸引力：${visionData.tag1 || '未選'}\n`;
        md += `- 頁面視覺氛圍：${visionData.tag2 || '未選'}\n`;
        if (selectedStyleName) md += `- 系統判定平面風格：${selectedStyleName}\n`;
        md += `\n`;

        const formatPackSection = (label, list) => {
          let sec = `${label}：\n`;
          const valid = list.filter(item => item.image || item.desc);
          if (valid.length === 0) return sec + `  - 無\n`;
          valid.forEach((item, idx) => {
            const imgText = item.image
              ? (item.image.startsWith('data:image') ? '[本機上傳截圖，請見隨附 PNG 長圖]' : item.image)
              : '無圖片';
            sec += `  ${idx + 1}. 說明：${item.desc || '無'} ｜ 參考圖：${imgText}\n`;
          });
          return sec;
        };

        md += `### 🎬 拍課包裝企劃\n`;
        md += formatPackSection('1. 課程空間意象', packData.spaces);
        md += formatPackSection('2. 包裝老師風格與參考照片', packData.teachers);
        md += formatPackSection('3. 場景道具清單', packData.props);

        md += `\n---\n⚠️ 備註說明：設計如需添購道具，需於拍課前 1~2 週下單。\n`;
        return md;
      };

      const handleCopyPlainText = () => {
        navigator.clipboard.writeText(buildPlainText());
        showToast('📋 已複製純文字交接單！');
      };

      const handleCopySectionText = (text, label) => {
        navigator.clipboard.writeText(text);
        showToast(`📋 已複製「${label}」文字！`);
      };

      // 匯出 PNG 圖文長圖
      const handleDownloadPng = async () => {
        if (!handoverCardRef.current || typeof window.html2canvas === 'undefined') {
          showToast('⚠️ 圖片轉換元件載入中，請稍候再試。');
          return;
        }
        setIsExportingPng(true);
        try {
          const canvas = await window.html2canvas(handoverCardRef.current, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#FFFFFF'
          });
          const dataUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          const fileName = `LP交接單_${formData.courseItem || formData.teacherName || '專案'}.png`;
          link.download = fileName;
          link.href = dataUrl;
          link.click();
          showToast('🖼️ 圖文交接單 (PNG 長圖) 已下載！可直接拖曳至 Slack');
        } catch (err) {
          console.error(err);
          showToast('⚠️ 圖片匯出遇到跨網域圖片限制，建議改用截圖或複製交接網址。');
        } finally {
          setIsExportingPng(false);
        }
      };

      // 複製整頁交接網址
      const handleCopyShareUrl = () => {
        const sanitizeList = (list) =>
          list.map(item => ({
            desc: item.desc,
            image: item.image && item.image.startsWith('data:image') ? '__LOCAL_IMAGE__' : item.image
          }));

        const payload = {
          formData,
          visionData,
          packData: {
            spaces: sanitizeList(packData.spaces),
            teachers: sanitizeList(packData.teachers),
            props: sanitizeList(packData.props)
          }
        };
        const encoded = encodeShareState(payload);
        const baseUrl = window.location.href.split('#')[0];
        const shareUrl = `${baseUrl}#share=${encoded}`;
        navigator.clipboard.writeText(shareUrl);
        if (window.location.protocol === 'file:') {
          showToast('🔗 已複製交接網址！（提醒：本機檔案需上傳至網路空間後，其他人才能點開連結喔）');
        } else {
          showToast('🔗 已複製整頁交接網址！設計師點開即可瀏覽與複製文字');
        }
      };

      // 交接單預覽卡片內的三欄圖文渲染（1:1 方形圖片）
      const renderHandoverGrid = (items) => {
        const validItems = items.filter(it => it.image || it.desc);
        if (validItems.length === 0) {
          return <p className="text-xs text-stone-400 italic">尚未填寫項目</p>;
        }
        return (
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mt-2">
            {validItems.map((it, idx) => (
              <div key={idx} className="border border-stone-200 rounded-lg overflow-hidden bg-[#FAF7F2]/50">
                {it.image === '__LOCAL_IMAGE__' ? (
                  <div className="relative w-full pb-[100%] bg-amber-50">
                    <div className="absolute inset-0 flex items-center justify-center text-xs text-amber-700 font-bold px-3 text-center">
                      📎 本機上傳圖片（請見隨附 PNG 長圖）
                    </div>
                  </div>
                ) : it.image ? (
                  <div className="relative w-full pb-[100%] bg-stone-100 overflow-hidden">
                    <div className="absolute inset-0">
                      <img src={it.image} alt={`參考 ${idx + 1}`} className="w-full h-full object-cover" />
                    </div>
                  </div>
                ) : null}
                <div className="p-2.5 text-xs text-stone-700 leading-relaxed">
                  <span className="font-bold text-[#9C795E] mr-1">#{idx + 1}</span>
                  {it.desc || '（無文字說明）'}
                </div>
              </div>
            ))}
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#FAF7F2] pb-16">
          {/* 浮動提示 Toast */}
          {toastMsg && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 bg-[#382D25] text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold z-50 animate-fade-in">
              {toastMsg}
            </div>
          )}

          {/* 分享連結開啟提示橫幅 */}
          {isSharedView && (
            <div className="bg-[#9C795E] text-white text-center py-2.5 px-4 text-sm font-bold shadow-xs">
              📩 已載入 PM 分享的交接單，可直接瀏覽圖文並複製所需文字
            </div>
          )}

          {/* 頂部導航與標題區 */}
          <header className="max-w-4xl mx-auto pt-8 pb-6 px-4 text-center">
            <h1 className="text-2xl md:text-3xl font-black text-[#382D25] tracking-tight mb-2">
              📝 視覺風格定位與拍課對接系統
            </h1>
            <p className="text-[#9C795E] text-sm md:text-base font-medium">
              將發散的視覺想像，收斂為具體的設計語言與拍課企劃
            </p>

            {/* 資料庫狀態列 */}
            <div className="mt-5 flex flex-wrap items-center justify-center gap-2.5">
              <div className="inline-flex items-center text-xs font-bold px-3.5 py-1.5 bg-[#f0e9df] text-[#7a5e48] rounded-full">
                <span className={`w-2 h-2 rounded-full mr-2 ${isLoadingDB ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                {isLoadingDB ? '正在同步雲端過往課程資料庫...' : `已同步 ${coursesDatabase.length} 筆過往對標案例`}
              </div>

              <button
                type="button"
                onClick={() => setShowAllModal(true)}
                className="inline-flex items-center text-xs font-bold px-3.5 py-1.5 bg-white hover:bg-stone-50 text-[#382D25] border border-[#EBE4D8] rounded-full shadow-xs transition-colors"
              >
                📚 瀏覽全部課程
              </button>

              <button
                type="button"
                onClick={() => { setTempCsvUrl(csvUrl); setShowCsvModal(true); }}
                className="inline-flex items-center text-xs font-bold px-3 py-1.5 bg-white hover:bg-stone-50 text-stone-500 border border-[#EBE4D8] rounded-full shadow-xs transition-colors"
                title="設定 Google 試算表 CSV 網址"
              >
                ⚙️ 資料來源
              </button>
            </div>
          </header>

          {/* 主內容區 */}
          <main className="max-w-4xl mx-auto px-4 space-y-6">
            {/* Step 1. 專案基本資料 */}
            <section className="bg-white rounded-2xl shadow-xs border border-[#EBE4D8] p-6 md:p-8">
              <h2 className="text-xl font-bold mb-6 pb-3 border-b-2 border-[#FAF7F2] text-[#382D25]">
                Step 1. 專案基本資料
              </h2>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                <div>
                  <label className="block text-sm font-bold text-stone-600 mb-1.5">老師姓名 / 品牌名</label>
                  <input
                    type="text"
                    placeholder="例如：何金源 / 璽甜．甜品工作室"
                    className="w-full p-2.5 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-[#9C795E]"
                    value={formData.teacherName}
                    onChange={(e) => setFormData({ ...formData, teacherName: e.target.value })}
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-stone-600 mb-1.5">課程品項</label>
                  <input
                    type="text"
                    placeholder="例如：中式麵點"
                    className="w-full p-2.5 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-[#9C795E]"
                    value={formData.courseItem}
                    onChange={(e) => setFormData({ ...formData, courseItem: e.target.value })}
                  />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-sm font-bold text-stone-600 mb-1.5">課程特色</label>
                  <input
                    type="text"
                    placeholder="例如：超多特殊口味、知識點豐富"
                    className="w-full p-2.5 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-[#9C795E]"
                    value={formData.courseFeatures}
                    onChange={(e) => setFormData({ ...formData, courseFeatures: e.target.value })}
                  />
                </div>
              </div>

              {/* 競品或對標網址 */}
              <div className="bg-[#FAF7F2] p-4 md:p-5 rounded-xl border border-[#EBE4D8]">
                <label className="block text-sm font-bold text-[#382D25] mb-3">🔍 競品或對標網址</label>
                {formData.competitors.map((comp, i) => (
                  <div key={i} className="flex flex-col md:flex-row gap-2.5 mb-3">
                    <input
                      type="text"
                      placeholder="貼上競品網址..."
                      className="w-full md:w-1/3 p-2.5 text-sm bg-white border border-stone-200 rounded-xl outline-none focus:border-[#9C795E]"
                      value={comp.url}
                      onChange={(e) => updateCompetitor(i, 'url', e.target.value)}
                    />
                    <input
                      type="text"
                      placeholder="希望參考這家競品的哪些部分？(例如：喜歡他的版型、老師照片風格...)"
                      className="w-full md:flex-1 p-2.5 text-sm bg-white border border-stone-200 rounded-xl outline-none focus:border-[#9C795E]"
                      value={comp.note}
                      onChange={(e) => updateCompetitor(i, 'note', e.target.value)}
                    />
                    {formData.competitors.length > 1 && (
                      <button
                        type="button"
                        onClick={() => removeCompetitor(i)}
                        className="text-stone-400 hover:text-red-500 px-2.5 font-bold text-lg self-center"
                      >
                        ×
                      </button>
                    )}
                  </div>
                ))}
                <button
                  type="button"
                  onClick={addCompetitor}
                  className="text-xs font-bold text-[#7a5e48] hover:text-[#382D25] bg-white border border-[#EBE4D8] px-3 py-1.5 rounded-lg transition-colors"
                >
                  + 新增一筆競品參考
                </button>
              </div>
            </section>

            {/* Step 2. 視覺大方向收斂 */}
            <section className="bg-white rounded-2xl shadow-xs border border-[#EBE4D8] p-6 md:p-8">
              <h2 className="text-xl font-bold mb-6 pb-3 border-b-2 border-[#FAF7F2] text-[#382D25]">
                Step 2. 視覺大方向收斂
              </h2>

              {/* Q1 */}
              <div className="mb-8">
                <p className="font-bold text-[#382D25] mb-3">Q1. 這堂課的主要吸引力是什麼？</p>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {TAG1_OPTIONS.map((opt) => {
                    const active = visionData.tag1 === opt.label;
                    return (
                      <button
                        key={opt.label}
                        type="button"
                        onClick={() => setVisionData({ ...visionData, tag1: opt.label })}
                        className={`p-4 rounded-xl border-2 text-left transition-all ${
                          active
                            ? 'border-[#9C795E] bg-[#FAF7F2] shadow-xs'
                            : 'border-stone-100 hover:border-stone-200 bg-white'
                        }`}
                      >
                        <div className={`font-bold text-base ${active ? 'text-[#7a5e48]' : 'text-stone-700'}`}>
                          {opt.label}
                        </div>
                        <div className="text-xs text-stone-500 mt-1.5">{opt.desc}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Q2 */}
              <div className="mb-6">
                <p className="font-bold text-[#382D25] mb-3">Q2. 希望頁面呈現哪種視覺氛圍？</p>
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  {TAG2_OPTIONS.map((opt) => {
                    const active = visionData.tag2 === opt.label;
                    return (
                      <button
                        key={opt.label}
                        type="button"
                        onClick={() => setVisionData({ ...visionData, tag2: opt.label })}
                        className={`p-3.5 rounded-xl border-2 text-left transition-all ${
                          active
                            ? 'border-[#9C795E] bg-[#FAF7F2] shadow-xs'
                            : 'border-stone-100 hover:border-stone-200 bg-white'
                        }`}
                      >
                        <div className={`font-bold text-sm ${active ? 'text-[#7a5e48]' : 'text-stone-700'}`}>
                          {opt.label}
                        </div>
                        <div className="text-xs text-stone-400 mt-1.5 leading-relaxed">{opt.desc}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 即時風格對應結果（嚴格雙重條件） */}
              {visionData.tag1 && visionData.tag2 && (
                <div className="mt-8 bg-[#FAF7F2] p-6 rounded-2xl border border-[#EBE4D8] animate-fade-in">
                  <h3 className="text-[#7a5e48] font-black text-lg mb-3">🎯 即時風格對應結果</h3>
                  <p className="font-bold text-stone-700 mb-5 flex flex-wrap items-center gap-2">
                    <span>📍 系統判定平面風格：</span>
                    <span className="bg-white text-[#382D25] px-3.5 py-1 rounded-lg border border-[#EBE4D8] shadow-xs">
                      {selectedStyleName}
                    </span>
                  </p>

                  <div className="border-t border-[#EBE4D8] pt-5">
                    <div className="flex items-center justify-between mb-3">
                      <p className="text-sm font-bold text-stone-700">📚 資料庫過往相似課程案例：</p>
                      <span className="text-xs font-bold bg-[#EBE4D8] text-[#7a5e48] px-2.5 py-0.5 rounded-full">
                        {matchedCourses.length} 筆相符
                      </span>
                    </div>

                    {matchedCourses.length > 0 ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {matchedCourses.map((c) => (
                          <a
                            key={c.id}
                            href={c.url}
                            target="_blank"
                            rel="noreferrer"
                            className="group block bg-white rounded-xl overflow-hidden border border-stone-200 shadow-xs hover:shadow-md transition-all"
                          >
                            <div className="h-32 bg-stone-100 relative overflow-hidden">
                              {c.image ? (
                                <img
                                  src={c.image}
                                  alt={c.title}
                                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                />
                              ) : (
                                <div className="flex items-center justify-center h-full text-xs text-stone-400">無封面圖</div>
                              )}
                              <span className="absolute top-2 right-2 text-[10px] font-bold bg-black/65 text-white px-2 py-0.5 rounded-md">
                                {c.platform}
                              </span>
                            </div>
                            <div className="p-3">
                              <p className="text-xs font-bold text-stone-800 line-clamp-2 mb-2 leading-snug">
                                {c.title}
                              </p>
                              <div className="flex gap-1.5 flex-wrap">
                                {c.tags.map((t) => (
                                  <span key={t} className="text-[10px] font-bold bg-[#FAF7F2] text-[#9C795E] px-2 py-0.5 rounded">
                                    #{t}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </a>
                        ))}
                      </div>
                    ) : (
                      <div className="bg-white text-stone-500 text-sm p-5 rounded-xl border border-[#EBE4D8] text-center">
                        目前雲端資料庫尚無同時符合「{visionData.tag1}」與「{visionData.tag2}」的案例，等待未來新增！
                      </div>
                    )}
                  </div>
                </div>
              )}
            </section>

            {/* Step 3. 拍課包裝企劃 */}
            <section className="bg-white rounded-2xl shadow-xs border border-[#EBE4D8] p-6 md:p-8">
              <h2 className="text-xl font-bold mb-2 text-[#382D25]">Step 3. 拍課包裝企劃</h2>
              <p className="text-sm text-stone-500 mb-6 pb-3 border-b-2 border-[#FAF7F2]">
                請貼上參考圖片網址（或上傳圖片 / Ctrl+V 貼上截圖）並填寫描述，系統將會自動整合成完整企劃清單。
              </p>

              {renderDynamicGrid('1. 課程空間意象', 'spaces', '例如：繽紛的糖果實驗室、復古東方茶館...')}
              {renderDynamicGrid('2. 包裝老師風格與參考照片', 'teachers', '例如：受媽媽們喜愛的帥氣老師...')}
              {renderDynamicGrid('3. 場景道具清單', 'props', '例如：竹編蒸籠、木製粿印模具、馬卡龍色系背景紙...')}
            </section>

            {/* Step 4. 生成交接單 */}
            <section className="bg-white rounded-2xl shadow-xs border border-[#EBE4D8] p-6 md:p-8">
              <div className="text-center mb-6">
                <h2 className="text-xl font-bold mb-2 text-[#382D25]">Step 4. 生成交接單</h2>
                <p className="text-sm text-stone-500">
                  所有資料填寫完畢後，可下載圖文長圖貼至 Slack，或複製交接網址 / 純文字交接單。
                </p>
              </div>

              {/* 三大操作按鈕 */}
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mb-8">
                <button
                  type="button"
                  onClick={handleDownloadPng}
                  disabled={isExportingPng}
                  className="w-full sm:w-auto px-6 py-3.5 bg-[#382D25] hover:bg-[#2a211b] text-white text-sm font-bold rounded-xl shadow-sm transition-all cursor-pointer"
                >
                  {isExportingPng ? '⏳ 正在產生圖文長圖...' : '🖼️ 下載圖文交接單 (PNG 長圖)'}
                </button>

                <button
                  type="button"
                  onClick={handleCopyShareUrl}
                  className="w-full sm:w-auto px-6 py-3.5 bg-[#9C795E] hover:bg-[#85654d] text-white text-sm font-bold rounded-xl shadow-sm transition-all cursor-pointer"
                >
                  🔗 複製整頁交接網址
                </button>

                <button
                  type="button"
                  onClick={handleCopyPlainText}
                  className="w-full sm:w-auto px-6 py-3.5 bg-[#FAF7F2] hover:bg-[#f0e9df] text-[#382D25] border border-[#EBE4D8] text-sm font-bold rounded-xl transition-all cursor-pointer"
                >
                  📋 一鍵複製純文字交接單
                </button>
              </div>

              {/* 即時圖文交接單預覽卡片（供匯出 PNG 與設計師直接檢視複製） */}
              <div
                ref={handoverCardRef}
                className="bg-white border-2 border-[#EBE4D8] rounded-2xl p-6 md:p-8 shadow-xs"
              >
                <div className="flex items-center justify-between border-b-2 border-[#FAF7F2] pb-4 mb-5">
                  <h3 className="text-lg md:text-xl font-black text-[#382D25]">
                    📋 【Landing Page 設計與拍課交接單】
                  </h3>
                  <span className="text-xs font-bold text-[#9C795E] bg-[#FAF7F2] px-3 py-1 rounded-full">
                    {formData.courseItem || '新開課程專案'}
                  </span>
                </div>

                {/* 基本資料摘要 */}
                <div className="mb-6">
                  <div className="flex items-center justify-between mb-2">
                    <h4 className="text-sm font-bold text-[#7a5e48]">📝 專案基本資料</h4>
                    <button
                      type="button"
                      onClick={() =>
                        handleCopySectionText(
                          `老師/品牌：${formData.teacherName}\n課程品項：${formData.courseItem}\n課程特色：${formData.courseFeatures}`,
                          '基本資料'
                        )
                      }
                      className="text-[11px] text-stone-400 hover:text-[#382D25] underline"
                    >
                      複製此區文字
                    </button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs bg-[#FAF7F2] p-4 rounded-xl">
                    <div><span className="text-stone-400 font-bold">老師 / 品牌：</span>{formData.teacherName || '未填'}</div>
                    <div><span className="text-stone-400 font-bold">課程品項：</span>{formData.courseItem || '未填'}</div>
                    <div className="sm:col-span-2"><span className="text-stone-400 font-bold">課程特色：</span>{formData.courseFeatures || '未填'}</div>
                  </div>

                  {/* 競品列表 */}
                  {formData.competitors.some(c => c.url || c.note) && (
                    <div className="mt-3 text-xs bg-stone-50 p-3.5 rounded-xl border border-stone-100">
                      <p className="font-bold text-stone-600 mb-1.5">🔍 競品或對標參考：</p>
                      <ul className="space-y-1.5">
                        {formData.competitors.filter(c => c.url || c.note).map((c, idx) => (
                          <li key={idx} className="text-stone-700 break-all">
                            <span className="font-bold text-[#9C795E] mr-1">{idx + 1}.</span>
                            {c.url && (
                              <a href={c.url} target="_blank" rel="noreferrer" className="text-blue-600 underline mr-2">
                                {c.url}
                              </a>
                            )}
                            {c.note && <span>（參考重點：{c.note}）</span>}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>

                {/* 視覺定位 */}
                <div className="mb-6">
                  <h4 className="text-sm font-bold text-[#7a5e48] mb-2">🎨 視覺大方向收斂</h4>
                  <div className="flex flex-wrap gap-2 text-xs">
                    <span className="bg-[#FAF7F2] border border-[#EBE4D8] px-3 py-1.5 rounded-lg font-bold">
                      主要吸引力：{visionData.tag1 || '未選'}
                    </span>
                    <span className="bg-[#FAF7F2] border border-[#EBE4D8] px-3 py-1.5 rounded-lg font-bold">
                      頁面視覺氛圍：{visionData.tag2 || '未選'}
                    </span>
                    {selectedStyleName && (
                      <span className="bg-[#382D25] text-white px-3 py-1.5 rounded-lg font-bold">
                        風格定位：{selectedStyleName}
                      </span>
                    )}
                  </div>
                </div>

                {/* 拍課企劃三欄圖文（1:1 方形圖片） */}
                <div className="space-y-5">
                  <div>
                    <h4 className="text-sm font-bold text-[#7a5e48]">🎬 1. 課程空間意象</h4>
                    {renderHandoverGrid(packData.spaces)}
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-[#7a5e48]">👤 2. 包裝老師風格與參考照片</h4>
                    {renderHandoverGrid(packData.teachers)}
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-[#7a5e48]">🧺 3. 場景道具清單</h4>
                    {renderHandoverGrid(packData.props)}
                  </div>
                </div>

                {/* 底部提醒警語 */}
                <div className="mt-6 pt-4 border-t border-[#EBE4D8] text-xs text-red-500 font-bold text-center">
                  ⚠️ 備註說明：設計如需添購道具，需於拍課前 1~2 週下單。
                </div>
              </div>
            </section>
          </main>

          {/* 彈窗：瀏覽全部課程 */}
          {showAllModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-5 border-b border-stone-200 flex items-center justify-between bg-[#FAF7F2]">
                  <h3 className="font-black text-lg text-[#382D25]">
                    📚 雲端課程資料庫總覽（共 {coursesDatabase.length} 筆）
                  </h3>
                  <button
                    type="button"
                    onClick={() => setShowAllModal(false)}
                    className="w-8 h-8 rounded-full bg-white text-stone-500 hover:text-stone-800 font-bold text-lg"
                  >
                    ×
                  </button>
                </div>
                <div className="p-5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {coursesDatabase.map((c) => (
                    <a
                      key={c.id}
                      href={c.url}
                      target="_blank"
                      rel="noreferrer"
                      className="block bg-white rounded-xl overflow-hidden border border-stone-200 hover:shadow-md transition-all"
                    >
                      <div className="h-28 bg-stone-100 relative">
                        {c.image && <img src={c.image} alt={c.title} className="w-full h-full object-cover" />}
                        <span className="absolute top-2 right-2 text-[10px] font-bold bg-black/65 text-white px-2 py-0.5 rounded">
                          {c.platform}
                        </span>
                      </div>
                      <div className="p-3">
                        <p className="text-xs font-bold text-stone-800 line-clamp-2 mb-2">{c.title}</p>
                        <div className="flex gap-1.5 flex-wrap">
                          {c.tags.map((t) => (
                            <span key={t} className="text-[10px] font-bold bg-[#FAF7F2] text-[#9C795E] px-2 py-0.5 rounded">
                              #{t}
                            </span>
                          ))}
                        </div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：設定 Google 試算表 CSV 網址 */}
          {showCsvModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <h3 className="font-black text-lg text-[#382D25] mb-2">⚙️ 設定 Google 試算表 CSV 網址</h3>
                <p className="text-xs text-stone-500 mb-4 leading-relaxed">
                  若您發布了新版試算表（例如 V4 資料庫），請將「檔案 &gt; 共用 &gt; 發布到網路 &gt; CSV」取得的網址貼在下方，系統會自動記憶在您的瀏覽器中。
                </p>
                <input
                  type="text"
                  placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv"
                  className="w-full p-2.5 text-xs border border-stone-200 rounded-xl outline-none focus:border-[#9C795E] mb-4"
                  value={tempCsvUrl}
                  onChange={(e) => setTempCsvUrl(e.target.value)}
                />
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowCsvModal(false)}
                    className="px-4 py-2 text-xs font-bold text-stone-500 hover:bg-stone-100 rounded-lg"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      localStorage.setItem('lp_custom_csv_url', tempCsvUrl.trim());
                      setCsvUrl(tempCsvUrl.trim());
                      setShowCsvModal(false);
                      showToast('✅ 已更新資料庫來源並重新同步！');
                    }}
                    className="px-4 py-2 text-xs font-bold bg-[#382D25] text-white rounded-lg"
                  >
                    儲存並同步
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DesignIntakeSystem />);
  </script>
</body>
</html>
